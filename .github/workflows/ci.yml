name: Validación de rendiciones

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar OCR
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Dependencias Python
        run: python -m pip install -r requirements.txt pytest
      - name: Boletas de fecha reciente y BPMN
        run: python scripts/generate_samples.py && python scripts/generate_bpmn.py
      - name: Pruebas de dominio
        run: python -m pytest -q
      - name: Construir interfaz
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Configuración Docker
        run: docker compose config --quiet
      - name: Construir imagen de escritorio
        run: docker build -t rendicion-lab:ci .
